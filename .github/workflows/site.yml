name: Static Site CI
on:
  push:
    paths:
      - "assets/**"
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
jobs:
  release:
    name: Build and deploy site
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/upptime-shared.yml
    with:
      command: site
      job-name: Build and deploy site
      deploy: true
    secrets:
      GH_PAT: ${{ secrets.GH_PAT || github.token }}

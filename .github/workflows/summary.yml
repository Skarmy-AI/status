name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
jobs:
  release:
    name: Generate README
    uses: ./.github/workflows/upptime-shared.yml
    with:
      command: readme
      job-name: Generate README
    secrets:
      GH_PAT: ${{ secrets.GH_PAT || github.token }}

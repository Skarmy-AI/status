name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
jobs:
  release:
    name: Check status
    uses: ./.github/workflows/upptime-shared.yml
    with:
      command: update
      job-name: Check status
      needs-secrets: true
    secrets:
      GH_PAT: ${{ secrets.GH_PAT || github.token }}

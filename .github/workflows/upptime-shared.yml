# ===============================
# This workflow is hand-maintained.
# ===============================
#
# Do not run Upptime's update-template command; it would overwrite the pinned action refs.
# All Upptime workflows in this repo use this reusable workflow.

name: Shared Upptime Job

on:
  workflow_call:
    inputs:
      command:
        description: Upptime command to run
        required: true
        type: string
      job-name:
        default: Run Upptime
        description: Display name for the job
        required: false
        type: string
      node-version:
        default: ""
        description: Optional Node.js version to set up before the command
        required: false
        type: string
      needs-secrets:
        default: false
        description: Whether to pass the notification secrets context to Upptime
        required: false
        type: boolean
      deploy:
        default: false
        description: Whether to deploy the generated site to GitHub Pages
        required: false
        type: boolean
    secrets:
      GH_PAT:
        description: GitHub PAT or token with commit access
        required: false

jobs:
  run:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: ./.github/actions/checkout-repo
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node-version }}
      - name: Run Upptime command
        if: ${{ !inputs.needs-secrets }}
        uses: upptime/uptime-monitor@8575473b4713da59d62f8d0f7cb5e4dfb86d55b7 # v1.43.14
        with:
          command: ${{ inputs.command }}
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Run Upptime command with secrets
        if: ${{ inputs.needs-secrets }}
        uses: upptime/uptime-monitor@8575473b4713da59d62f8d0f7cb5e4dfb86d55b7 # v1.43.14
        with:
          command: ${{ inputs.command }}
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          # The notification secret allowlist is maintained in this workflow file.
          SECRETS_CONTEXT: '{"DYNAMIC_STRING_LENGTH":${{ toJson(secrets.DYNAMIC_STRING_LENGTH) }},"GLOBALPING_TOKEN":${{ toJson(secrets.GLOBALPING_TOKEN) }},"NOTIFICATIONS_DOWN_MESSAGE":${{ toJson(secrets.NOTIFICATIONS_DOWN_MESSAGE) }},"NOTIFICATIONS_UP_MESSAGE":${{ toJson(secrets.NOTIFICATIONS_UP_MESSAGE) }},"NOTIFICATION_CUSTOM_WEBHOOK":${{ toJson(secrets.NOTIFICATION_CUSTOM_WEBHOOK) }},"NOTIFICATION_CUSTOM_WEBHOOK_URL":${{ toJson(secrets.NOTIFICATION_CUSTOM_WEBHOOK_URL) }},"NOTIFICATION_DISCORD_WEBHOOK_URL":${{ toJson(secrets.NOTIFICATION_DISCORD_WEBHOOK_URL) }},"NOTIFICATION_EMAIL":${{ toJson(secrets.NOTIFICATION_EMAIL) }},"NOTIFICATION_EMAIL_FROM":${{ toJson(secrets.NOTIFICATION_EMAIL_FROM) }},"NOTIFICATION_EMAIL_MAILGUN":${{ toJson(secrets.NOTIFICATION_EMAIL_MAILGUN) }},"NOTIFICATION_EMAIL_MAILGUN_API_KEY":${{ toJson(secrets.NOTIFICATION_EMAIL_MAILGUN_API_KEY) }},"NOTIFICATION_EMAIL_MAILGUN_DOMAIN_NAME":${{ toJson(secrets.NOTIFICATION_EMAIL_MAILGUN_DOMAIN_NAME) }},"NOTIFICATION_EMAIL_SENDGRID":${{ toJson(secrets.NOTIFICATION_EMAIL_SENDGRID) }},"NOTIFICATION_EMAIL_SENDGRID_API_KEY":${{ toJson(secrets.NOTIFICATION_EMAIL_SENDGRID_API_KEY) }},"NOTIFICATION_EMAIL_SES":${{ toJson(secrets.NOTIFICATION_EMAIL_SES) }},"NOTIFICATION_EMAIL_SES_ACCESS_KEY_ID":${{ toJson(secrets.NOTIFICATION_EMAIL_SES_ACCESS_KEY_ID) }},"NOTIFICATION_EMAIL_SES_REGION":${{ toJson(secrets.NOTIFICATION_EMAIL_SES_REGION) }},"NOTIFICATION_EMAIL_SES_SECRET_ACCESS_KEY":${{ toJson(secrets.NOTIFICATION_EMAIL_SES_SECRET_ACCESS_KEY) }},"NOTIFICATION_EMAIL_SES_SESSION_TOKEN":${{ toJson(secrets.NOTIFICATION_EMAIL_SES_SESSION_TOKEN) }},"NOTIFICATION_EMAIL_SMTP":${{ toJson(secrets.NOTIFICATION_EMAIL_SMTP) }},"NOTIFICATION_EMAIL_SMTP_HOST":${{ toJson(secrets.NOTIFICATION_EMAIL_SMTP_HOST) }},"NOTIFICATION_EMAIL_SMTP_PASSWORD":${{ toJson(secrets.NOTIFICATION_EMAIL_SMTP_PASSWORD) }},"NOTIFICATION_EMAIL_SMTP_PORT":${{ toJson(secrets.NOTIFICATION_EMAIL_SMTP_PORT) }},"NOTIFICATION_EMAIL_SMTP_USERNAME":${{ toJson(secrets.NOTIFICATION_EMAIL_SMTP_USERNAME) }},"NOTIFICATION_EMAIL_SPARKPOST":${{ toJson(secrets.NOTIFICATION_EMAIL_SPARKPOST) }},"NOTIFICATION_EMAIL_SPARKPOST_API_KEY":${{ toJson(secrets.NOTIFICATION_EMAIL_SPARKPOST_API_KEY) }},"NOTIFICATION_EMAIL_STRATEGY":${{ toJson(secrets.NOTIFICATION_EMAIL_STRATEGY) }},"NOTIFICATION_EMAIL_TO":${{ toJson(secrets.NOTIFICATION_EMAIL_TO) }},"NOTIFICATION_GOOGLE_CHAT_WEBHOOK_URL":${{ toJson(secrets.NOTIFICATION_GOOGLE_CHAT_WEBHOOK_URL) }},"NOTIFICATION_GOTIFY":${{ toJson(secrets.NOTIFICATION_GOTIFY) }},"NOTIFICATION_GOTIFY_PRIORITY":${{ toJson(secrets.NOTIFICATION_GOTIFY_PRIORITY) }},"NOTIFICATION_GOTIFY_TITLE":${{ toJson(secrets.NOTIFICATION_GOTIFY_TITLE) }},"NOTIFICATION_GOTIFY_TOKEN":${{ toJson(secrets.NOTIFICATION_GOTIFY_TOKEN) }},"NOTIFICATION_GOTIFY_URL":${{ toJson(secrets.NOTIFICATION_GOTIFY_URL) }},"NOTIFICATION_LARK":${{ toJson(secrets.NOTIFICATION_LARK) }},"NOTIFICATION_LARK_BOT_WEBHOOK":${{ toJson(secrets.NOTIFICATION_LARK_BOT_WEBHOOK) }},"NOTIFICATION_MASTODON":${{ toJson(secrets.NOTIFICATION_MASTODON) }},"NOTIFICATION_MASTODON_API_KEY":${{ toJson(secrets.NOTIFICATION_MASTODON_API_KEY) }},"NOTIFICATION_MASTODON_INSTANCE_URL":${{ toJson(secrets.NOTIFICATION_MASTODON_INSTANCE_URL) }},"NOTIFICATION_MASTODON_TOOT_VISIBILITY":${{ toJson(secrets.NOTIFICATION_MASTODON_TOOT_VISIBILITY) }},"NOTIFICATION_MISSKEY":${{ toJson(secrets.NOTIFICATION_MISSKEY) }},"NOTIFICATION_MISSKEY_API_KEY":${{ toJson(secrets.NOTIFICATION_MISSKEY_API_KEY) }},"NOTIFICATION_MISSKEY_CHAT":${{ toJson(secrets.NOTIFICATION_MISSKEY_CHAT) }},"NOTIFICATION_MISSKEY_CHAT_USER_ID":${{ toJson(secrets.NOTIFICATION_MISSKEY_CHAT_USER_ID) }},"NOTIFICATION_MISSKEY_INSTANCE_URL":${{ toJson(secrets.NOTIFICATION_MISSKEY_INSTANCE_URL) }},"NOTIFICATION_MISSKEY_NOTE":${{ toJson(secrets.NOTIFICATION_MISSKEY_NOTE) }},"NOTIFICATION_MISSKEY_NOTE_VISIBILITY":${{ toJson(secrets.NOTIFICATION_MISSKEY_NOTE_VISIBILITY) }},"NOTIFICATION_MISSKEY_NOTE_VISIBLE_USER_IDS":${{ toJson(secrets.NOTIFICATION_MISSKEY_NOTE_VISIBLE_USER_IDS) }},"NOTIFICATION_SLACK":${{ toJson(secrets.NOTIFICATION_SLACK) }},"NOTIFICATION_SLACK_STRATEGY":${{ toJson(secrets.NOTIFICATION_SLACK_STRATEGY) }},"NOTIFICATION_SLACK_WEBHOOK_URL":${{ toJson(secrets.NOTIFICATION_SLACK_WEBHOOK_URL) }},"NOTIFICATION_SMS_46ELKS":${{ toJson(secrets.NOTIFICATION_SMS_46ELKS) }},"NOTIFICATION_SMS_46ELKS_API_PASSWORD":${{ toJson(secrets.NOTIFICATION_SMS_46ELKS_API_PASSWORD) }},"NOTIFICATION_SMS_46ELKS_API_USERNAME":${{ toJson(secrets.NOTIFICATION_SMS_46ELKS_API_USERNAME) }},"NOTIFICATION_SMS_CALLR":${{ toJson(secrets.NOTIFICATION_SMS_CALLR) }},"NOTIFICATION_SMS_CALLR_LOGIN":${{ toJson(secrets.NOTIFICATION_SMS_CALLR_LOGIN) }},"NOTIFICATION_SMS_CALLR_PASSWORD":${{ toJson(secrets.NOTIFICATION_SMS_CALLR_PASSWORD) }},"NOTIFICATION_SMS_CLICKATELL":${{ toJson(secrets.NOTIFICATION_SMS_CLICKATELL) }},"NOTIFICATION_SMS_CLICKATELL_API_KEY":${{ toJson(secrets.NOTIFICATION_SMS_CLICKATELL_API_KEY) }},"NOTIFICATION_SMS_FROM":${{ toJson(secrets.NOTIFICATION_SMS_FROM) }},"NOTIFICATION_SMS_INFOBIP":${{ toJson(secrets.NOTIFICATION_SMS_INFOBIP) }},"NOTIFICATION_SMS_INFOBIP_PASSWORD":${{ toJson(secrets.NOTIFICATION_SMS_INFOBIP_PASSWORD) }},"NOTIFICATION_SMS_INFOBIP_USERNAME":${{ toJson(secrets.NOTIFICATION_SMS_INFOBIP_USERNAME) }},"NOTIFICATION_SMS_NEXMO":${{ toJson(secrets.NOTIFICATION_SMS_NEXMO) }},"NOTIFICATION_SMS_NEXMO_API_KEY":${{ toJson(secrets.NOTIFICATION_SMS_NEXMO_API_KEY) }},"NOTIFICATION_SMS_NEXMO_API_SECRET":${{ toJson(secrets.NOTIFICATION_SMS_NEXMO_API_SECRET) }},"NOTIFICATION_SMS_OVH":${{ toJson(secrets.NOTIFICATION_SMS_OVH) }},"NOTIFICATION_SMS_OVH_ACCOUNT":${{ toJson(secrets.NOTIFICATION_SMS_OVH_ACCOUNT) }},"NOTIFICATION_SMS_OVH_APP_KEY":${{ toJson(secrets.NOTIFICATION_SMS_OVH_APP_KEY) }},"NOTIFICATION_SMS_OVH_APP_SECRET":${{ toJson(secrets.NOTIFICATION_SMS_OVH_APP_SECRET) }},"NOTIFICATION_SMS_OVH_CONSUMER_KEY":${{ toJson(secrets.NOTIFICATION_SMS_OVH_CONSUMER_KEY) }},"NOTIFICATION_SMS_OVH_HOST":${{ toJson(secrets.NOTIFICATION_SMS_OVH_HOST) }},"NOTIFICATION_SMS_PLIVO":${{ toJson(secrets.NOTIFICATION_SMS_PLIVO) }},"NOTIFICATION_SMS_PLIVO_AUTH_ID":${{ toJson(secrets.NOTIFICATION_SMS_PLIVO_AUTH_ID) }},"NOTIFICATION_SMS_PLIVO_AUTH_TOKEN":${{ toJson(secrets.NOTIFICATION_SMS_PLIVO_AUTH_TOKEN) }},"NOTIFICATION_SMS_STRATEGY":${{ toJson(secrets.NOTIFICATION_SMS_STRATEGY) }},"NOTIFICATION_SMS_TO":${{ toJson(secrets.NOTIFICATION_SMS_TO) }},"NOTIFICATION_SMS_TWILIO":${{ toJson(secrets.NOTIFICATION_SMS_TWILIO) }},"NOTIFICATION_SMS_TWILIO_ACCOUNT_SID":${{ toJson(secrets.NOTIFICATION_SMS_TWILIO_ACCOUNT_SID) }},"NOTIFICATION_SMS_TWILIO_AUTH_TOKEN":${{ toJson(secrets.NOTIFICATION_SMS_TWILIO_AUTH_TOKEN) }},"NOTIFICATION_TEAMS":${{ toJson(secrets.NOTIFICATION_TEAMS) }},"NOTIFICATION_TEAMS_WEBHOOK_URL":${{ toJson(secrets.NOTIFICATION_TEAMS_WEBHOOK_URL) }},"NOTIFICATION_TELEGRAM":${{ toJson(secrets.NOTIFICATION_TELEGRAM) }},"NOTIFICATION_TELEGRAM_BOT_KEY":${{ toJson(secrets.NOTIFICATION_TELEGRAM_BOT_KEY) }},"NOTIFICATION_TELEGRAM_CHAT_ID":${{ toJson(secrets.NOTIFICATION_TELEGRAM_CHAT_ID) }},"NOTIFICATION_ZULIP_API_EMAIL":${{ toJson(secrets.NOTIFICATION_ZULIP_API_EMAIL) }},"NOTIFICATION_ZULIP_API_KEY":${{ toJson(secrets.NOTIFICATION_ZULIP_API_KEY) }},"NOTIFICATION_ZULIP_MESSAGE_URL":${{ toJson(secrets.NOTIFICATION_ZULIP_MESSAGE_URL) }},"RANDOM_MAX":${{ toJson(secrets.RANDOM_MAX) }},"RANDOM_MIN":${{ toJson(secrets.RANDOM_MIN) }},"USER_AGENT":${{ toJson(secrets.USER_AGENT) }}}'
      - name: Deploy to GitHub Pages
        if: ${{ inputs.deploy }}
        uses: ./.github/actions/deploy-gh-pages
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
